<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
	<title>PDF预览</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #404040;
			overflow-x: hidden;
		}

		#loading {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #fff;
			font-size: 16px;
			text-align: center;
		}

		.spinner {
			width: 40px;
			height: 40px;
			border: 3px solid rgba(255,255,255,0.3);
			border-top-color: #fff;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin: 0 auto 15px;
		}

		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		#viewer {
			width: 100%;
			padding: 10px 0;
		}

		.page-container {
			margin: 8px auto;
			background: white;
			box-shadow: 0 2px 8px rgba(0,0,0,0.3);
			overflow: hidden;
		}

		canvas {
			display: block;
			width: 100%;
			height: auto;
		}

		#error {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #ff6b6b;
			font-size: 14px;
			text-align: center;
			padding: 20px;
			display: none;
		}

		#page-info {
			position: fixed;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(0,0,0,0.7);
			color: #fff;
			padding: 8px 16px;
			border-radius: 20px;
			font-size: 12px;
			opacity: 0;
			transition: opacity 0.3s;
		}

		#page-info.show {
			opacity: 1;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div class="spinner"></div>
		<div>加载中...</div>
	</div>

	<div id="error"></div>

	<div id="viewer"></div>

	<div id="page-info"></div>

	<script>
		// 设置 PDF.js worker
		pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

		// 获取URL参数
		const params = new URLSearchParams(location.search);
		const pdfUrl = params.get('file');

		const loadingEl = document.getElementById('loading');
		const viewerEl = document.getElementById('viewer');
		const errorEl = document.getElementById('error');
		const pageInfoEl = document.getElementById('page-info');

		let totalPages = 0;
		let renderedPages = [];

		if (!pdfUrl) {
			showError('未提供PDF文件路径');
		} else {
			loadPdf(decodeURIComponent(pdfUrl));
		}

		function showError(msg) {
			loadingEl.style.display = 'none';
			errorEl.style.display = 'block';
			errorEl.textContent = msg;
		}

		function showPageInfo() {
			// 计算当前可见页面
			const scrollTop = window.scrollY;
			const windowHeight = window.innerHeight;
			const centerY = scrollTop + windowHeight / 2;

			let currentPage = 1;
			renderedPages.forEach((page, index) => {
				const rect = page.container.getBoundingClientRect();
				const pageTop = rect.top + scrollTop;
				const pageBottom = pageTop + rect.height;
				if (centerY >= pageTop && centerY <= pageBottom) {
					currentPage = index + 1;
				}
			});

			pageInfoEl.textContent = `${currentPage} / ${totalPages}`;
			pageInfoEl.classList.add('show');

			clearTimeout(window.pageInfoTimer);
			window.pageInfoTimer = setTimeout(() => {
				pageInfoEl.classList.remove('show');
			}, 1500);
		}

		async function loadPdf(url) {
			try {
				const pdf = await pdfjsLib.getDocument(url).promise;
				totalPages = pdf.numPages;

				loadingEl.style.display = 'none';

				// 渲染所有页面
				for (let i = 1; i <= totalPages; i++) {
					await renderPage(pdf, i);
				}

				// 监听滚动显示页码
				window.addEventListener('scroll', showPageInfo);
				showPageInfo();

			} catch (err) {
				console.error('PDF加载失败:', err);
				showError('PDF加载失败: ' + (err.message || '未知错误'));
			}
		}

		async function renderPage(pdf, pageNum) {
			const page = await pdf.getPage(pageNum);

			// 计算缩放比例，使页面宽度适应屏幕
			const containerWidth = window.innerWidth - 20; // 留一点边距
			const viewport = page.getViewport({ scale: 1 });
			const scale = containerWidth / viewport.width;
			const scaledViewport = page.getViewport({ scale: scale * window.devicePixelRatio });

			// 创建容器
			const container = document.createElement('div');
			container.className = 'page-container';
			container.style.width = containerWidth + 'px';

			// 创建canvas
			const canvas = document.createElement('canvas');
			const context = canvas.getContext('2d');
			canvas.width = scaledViewport.width;
			canvas.height = scaledViewport.height;
			canvas.style.width = containerWidth + 'px';
			canvas.style.height = (scaledViewport.height / window.devicePixelRatio) + 'px';

			container.appendChild(canvas);
			viewerEl.appendChild(container);

			// 渲染页面
			await page.render({
				canvasContext: context,
				viewport: scaledViewport
			}).promise;

			renderedPages.push({ container, canvas });
		}
	</script>
</body>
</html>
